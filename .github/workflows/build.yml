name: build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build (includes timing engine self test)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --console=plain --no-daemon 2>&1 | tee build.log

      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pvpislifemod-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      # Action logs live on Azure blob storage, which is not reachable everywhere.
      # Mirror the interesting part of the log into an issue comment so it can be read
      # with the REST API from any environment.
      - name: publish build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.build.outcome }}
          REPO: ${{ github.repository }}
        run: |
          test -f build.log || echo "gradle produced no log" > build.log
          {
            echo "### \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA:0:7} — build: **${OUTCOME}**"
            echo ""
            echo '```text'
            tail -c 45000 build.log
            echo '```'
          } > comment.md
          gh api --method POST "repos/${REPO}/issues/1/comments" -F body=@comment.md

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" build/libs/*.jar --title "PVPIsLife Timing ${GITHUB_REF_NAME}" --generate-notes

      - name: fail the job when the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  # Boots a real Minecraft 26.3 client with the mod installed: this is what proves the mixins
  # apply, that the HUD element renders and that the timing engine behaves inside the game.
  client_game_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: run client game test
        id: gametest
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
          MESA_GL_VERSION_OVERRIDE: '4.6'
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./gradlew runClientGameTest --stacktrace --info --console=plain --no-daemon 2>&1 | tee gametest.log

      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots
          path: |
            build/pvpislifemod-preview.png
            build/run/clientGameTest/screenshots/*.png
          if-no-files-found: warn

      - name: publish game test result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ steps.gametest.outcome }}
          REPO: ${{ github.repository }}
        run: |
          test -f gametest.log || echo "no log" > gametest.log
          {
            echo "### client game test \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA:0:7} — **${OUTCOME}**"
            echo ""
            echo '```text'
            tail -c 30000 gametest.log
            echo '```'
          } > gt-comment.md
          gh api --method POST "repos/${REPO}/issues/1/comments" -F body=@gt-comment.md

          if [ -f build/pvpislifemod-preview.png ]; then
            echo "### HUD preview (cropped screenshot from the game test)" > preview.md
            echo "" >> preview.md
            echo '```text' >> preview.md
            base64 -w0 build/pvpislifemod-preview.png | head -c 40000 >> preview.md
            echo "" >> preview.md
            echo '```' >> preview.md
            gh api --method POST "repos/${REPO}/issues/1/comments" -F body=@preview.md
          fi

      - name: fail when the client game test failed
        if: steps.gametest.outcome != 'success'
        run: exit 1
